// E3: simulation speed and swatch behaviour, no breakpoints. %LOG% replaced by run-sim.ps1.
LOG >%LOG%
MAP 0xE0001000, 0xE0001FFF READ WRITE
SIGNAL void stop_at (float secs) {
  swatch (secs);
  _break_ = 1;
}
printf("BEFORE states=%u CCLK=%u\n", states, CCLK)
stop_at (0.25)
G
printf("AFTER states=%u CCLK=%u FIO1PIN=%08X\n", states, CCLK, _RDWORD(0x2009C034))
LOG OFF
EXIT
