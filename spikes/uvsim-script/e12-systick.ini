// E12: SysTick register semantics in the LPC1768 simulator, from real firmware.
// e12-systick-firmware.c is built by ARMCC 5.06 in a copy of the bit-band test
// firmware project with its main source replaced (as for E9); it runs from reset
// with no SysTick interrupt, records register reads in r[], and this INI prints them.
//
// Outcome (e12-run1.out, e12-run2.out identical):
//   r0 = 996: STCURR held RELOAD (999) as soon as ENABLE was set, 3 clocks earlier.
//   r1 = 00000005: the STCTRL read that returned COUNTFLAG cleared it.
//   r2 = 00010005, r3 = 00000005: set again at the next count to 0, cleared by reading.
//   r4 = 997: writing STCURR cleared it; the next clock wrapped to RELOAD.
//   r5 = 989: disabling holds the counter.
//   r6 = 497: re-enabling with STCURR = 989 and RELOAD = 500 loaded 500: ENABLE loads
//            RELOAD whatever STCURR holds.
//   r7 = 00000000: STCALIB reads 0 from firmware too (UM10360: boot-code value 0x000F423F).
LOG >%LOG%
MAP 0xE0001000, 0xE0001FFF READ WRITE
printf("RESET STCTRL=%08X STRELOAD=%08X STCURR=%08X STCALIB=%08X\n", _RDWORD(0xE000E010), _RDWORD(0xE000E014), _RDWORD(0xE000E018), _RDWORD(0xE000E01C))
G, finished
printf("r0 VAL after enable       = %u\n", r[0])
printf("r1 CTRL after flag seen   = %08X\n", r[1])
printf("r2 CTRL after next zero   = %08X\n", r[2])
printf("r3 CTRL read again        = %08X\n", r[3])
printf("r4 VAL after writing 123  = %u\n", r[4])
printf("r5 VAL after disabling    = %u\n", r[5])
printf("r6 VAL after re-enable, LOAD 500 = %u\n", r[6])
printf("r7 CALIB (firmware read)  = %08X\n", r[7])
LOG OFF
EXIT
