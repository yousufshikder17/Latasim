// E2: observe LED GPIO writes on simulated time. %LOG% is replaced by run-sim.ps1.
// FIO1 = 0x2009C020 (+0x14 PIN, +0x18 SET, +0x1C CLR); FIO2 = 0x2009C040. LED0 = P1.28.
// "seconds" is undefined for LPC1768 (error 34): time is derived from "states" / CCLK.
LOG >%LOG%
MAP 0xE0001000, 0xE0001FFF READ WRITE   // DWT for Event Recorder (error 65 otherwise)

FUNC void gpio_w (void) {
  printf("W states=%u CCLK=%u FIO1PIN=%08X LED0=%u FIO2PIN=%08X PORT1=%08X\n",
         states, CCLK, _RDWORD(0x2009C034), (_RDWORD(0x2009C034) >> 28) & 1,
         _RDWORD(0x2009C054), PORT1);
}
SIGNAL void stop_at (float secs) {   // a parameter named "t" is a syntax error (clashes with the T command)
  swatch (secs);
  _break_ = 1;
}

printf("BEFORE states=%u FIO1DIR=%08X FIO1PIN=%08X\n", states, _RDWORD(0x2009C020), _RDWORD(0x2009C034))
BA WRITE (unsigned long *)0x2009C038, 8, 1, "gpio_w()"
BA WRITE (unsigned long *)0x2009C058, 8, 1, "gpio_w()"
stop_at (1.05)
G
printf("AFTER states=%u CCLK=%u FIO1DIR=%08X FIO1PIN=%08X\n", states, CCLK, _RDWORD(0x2009C020), _RDWORD(0x2009C034))
LOG OFF
EXIT
