// E9: CPU-executed byte/halfword GPIO accesses in the LPC1768 simulator, plus PCONP.
// E8 could not make the simulated CPU run hand-assembled STRB/STRH from an INI. E9
// instead builds real firmware (e9-gpio-subword-firmware.c, compiled by ARMCC 5.06 in
// a copy of the bit-band test firmware project with its main source replaced) and
// runs it normally from reset. fromelf -c confirms each narrow access compiled to a
// single STRB/STRH/LDRB/LDRH. checkpoint(id) is a breakpoint; snap() reads port 1
// with 32-bit debugger reads (reliable per E8 part 1). FIOSET reads the latch.
//
// Outcome (e9-run1.out, e9-run2.out identical):
//   CP1/CP2  STRB FIO1PIN0 / STRH FIO1PINL: byte 3 (inputs, reading high) of the
//            latch becomes FF: the simulator treats a narrow FIOPIN store as a word
//            read-modify-write of FIOPIN.
//   CP3-CP6  narrow SET/CLR/DIR stores are lane-local (no byte replication).
//   CP7      narrow PIN store under a narrow MASK store: latch F0, as either rule gives.
//   CP8      LDRB FIO1PIN3 = 12, LDRH FIO1PINH = 1234: narrow loads are lane-correct.
//   RESET    PCONP = 042887DE at state 0, before SystemInit.
//   CP9      clearing PCONP bit 15 (PCGPIO) does not stop a FIOSET write.
LOG >%LOG%
MAP 0xE0001000, 0xE0001FFF READ WRITE

FUNC void snap (void) {
  printf("CP%u DIR=%08X MASK=%08X PIN=%08X SET=%08X PCONP=%08X L8=%08X L16=%08X\n", R0, _RDWORD(0x2009C020), _RDWORD(0x2009C030), _RDWORD(0x2009C034), _RDWORD(0x2009C038), _RDWORD(0x400FC0C4), g_load8, g_load16);
}

printf("RESET states=%u PCONP=%08X FIO1DIR=%08X FIO1SET=%08X\n", states, _RDWORD(0x400FC0C4), _RDWORD(0x2009C020), _RDWORD(0x2009C038))
BS checkpoint, 1, "snap()"
G, main
printf("MAIN states=%u PCONP=%08X\n", states, _RDWORD(0x400FC0C4))
G, finished
printf("DONE g_id=%X\n", g_id)
LOG OFF
EXIT
