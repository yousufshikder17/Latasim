// E8: byte and halfword access to LPC17xx GPIO registers in the LPC1768 simulator.
//
// Part 1 shows the debugger's own access functions can't be trusted for this:
// on plain SRAM, _WWORD/_RWORD move 32 bits although the help says "short int".
// Part 2 therefore has the simulated CPU execute real STRB/STRH/LDRB/LDRH
// instructions, hand-assembled into on-chip SRAM; each is run with G, <next>:
//   0x10000100 7001 strb r1,[r0]     0x10000102 8001 strh r1,[r0]
//   0x10000104 6001 str  r1,[r0]     0x10000106 7802 ldrb r2,[r0]
//   0x10000108 8802 ldrh r2,[r0]     0x1000010A E7FE b .
// Port 1: DIR 0x2009C020, MASK +0x10, PIN +0x14, SET +0x18, CLR +0x1C; byte n = base + n.
//
// Outcome (e8-run1.out): part 1 confirms the 32-bit behaviour. Part 2 did NOT execute:
// PC stays put, because G from a debugger-set PC doesn't run inside an INI (same on
// two projects). Part 3 records that the debugger's _WBYTE to FIO1PIN0 acts like a
// word read-modify-write (input levels land in the latch); given part 1 that is not
// evidence of what a CPU STRB does. Byte/halfword CPU semantics stay unverified here.
LOG >%LOG%
_WDWORD(0x10000000, 0x00000000)
_WWORD(0x10000000, 0x12345678)
printf("D1 SRAM after _WWORD(0x12345678): %08X\n", _RDWORD(0x10000000))
_WDWORD(0x10000000, 0xAABBCCDD)
printf("D2 SRAM _RWORD=%08X _RBYTE=%02X\n", _RWORD(0x10000000), _RBYTE(0x10000000))

_WDWORD(0x10000100, 0x80017001)
_WDWORD(0x10000104, 0x78026001)
_WDWORD(0x10000108, 0xE7FE8802)
XPSR = 0x01000000

// Setup: all outputs except byte 3 (P1.24-31 inputs, pulled high), latch 0x00000001,
// bit 0 masked. A lane-only byte store and a word read-modify-write differ in byte 3.
_WDWORD(0x2009C030, 0x00000000)
_WDWORD(0x2009C020, 0x00FFFFFF)
_WDWORD(0x2009C034, 0x00000001)
_WDWORD(0x2009C030, 0x00000001)
printf("C0 setup: DIR=%08X MASK=%08X PIN=%08X SET=%08X\n", _RDWORD(0x2009C020), _RDWORD(0x2009C030), _RDWORD(0x2009C034), _RDWORD(0x2009C038))
R0 = 0x2009C034
R1 = 0x000000FE
$ = 0x10000100
G, 0x10000102
printf("C1 STRB FIO1PIN0=0xFE: PC=%08X PIN=%08X SET=%08X\n", $, _RDWORD(0x2009C034), _RDWORD(0x2009C038))
_WDWORD(0x2009C030, 0x00000000)
_WDWORD(0x2009C034, 0x00000000)
R0 = 0x2009C034
R1 = 0x0000ABCD
$ = 0x10000102
G, 0x10000104
printf("C2 STRH FIO1PINL=0xABCD: PC=%08X PIN=%08X SET=%08X\n", $, _RDWORD(0x2009C034), _RDWORD(0x2009C038))
R0 = 0x2009C03A
R1 = 0x00001000
$ = 0x10000102
G, 0x10000104
printf("C3 STRH FIO1SETH=0x1000: PIN=%08X SET=%08X\n", _RDWORD(0x2009C034), _RDWORD(0x2009C038))
R0 = 0x2009C03F
R1 = 0x00000010
$ = 0x10000100
G, 0x10000102
printf("C4 STRB FIO1CLR3=0x10: PIN=%08X SET=%08X\n", _RDWORD(0x2009C034), _RDWORD(0x2009C038))
R0 = 0x2009C023
R1 = 0x000000F0
$ = 0x10000100
G, 0x10000102
printf("C5 STRB FIO1DIR3=0xF0: DIR=%08X PIN=%08X\n", _RDWORD(0x2009C020), _RDWORD(0x2009C034))
R0 = 0x2009C037
R2 = 0
$ = 0x10000106
G, 0x10000108
printf("C6 LDRB FIO1PIN3: R2=%08X (PIN=%08X)\n", R2, _RDWORD(0x2009C034))
R0 = 0x2009C036
R2 = 0
$ = 0x10000108
G, 0x1000010A
printf("C7 LDRH FIO1PINH: R2=%08X\n", R2)
R0 = 0x2009C038
R2 = 0
$ = 0x10000106
G, 0x10000108
printf("C8 LDRB FIO1SET0: R2=%08X\n", R2)

// Part 3: the debugger's own byte write, same setup as C0.
_WDWORD(0x2009C030, 0x00000000)
_WDWORD(0x2009C020, 0x00FFFFFF)
_WDWORD(0x2009C034, 0x00000001)
_WDWORD(0x2009C030, 0x00000001)
_WBYTE(0x2009C034, 0xFE)
printf("W1 debugger _WBYTE FIO1PIN0=0xFE: PIN=%08X SET=%08X\n", _RDWORD(0x2009C034), _RDWORD(0x2009C038))
LOG OFF
EXIT
