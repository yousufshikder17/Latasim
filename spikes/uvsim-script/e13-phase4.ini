printf("B r6 ISPR0 IR set, disabled   = %08X\n", r[6])
printf("B r7 ISPR0 after ICPR         = %08X\n", r[7])
printf("B r8 ISPR0 after IR clear+ICPR= %08X\n", r[8])
printf("C r9 handlers run             = %u\n", r[9])
