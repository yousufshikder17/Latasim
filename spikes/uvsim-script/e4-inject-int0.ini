// E4: inject an INT0 press through the PORT2 pin VTREG and observe the firmware react.
// Blinky: thrBUT polls Buttons_GetState() every 100 ms (INT0 = P2.10, active low); a press
// edge flags thrLED, which stops blinking at its next loop start (t = 1.0 s).
// Without the press (E2) LED_On happens at t = 1.0 s; with it, it must not.
LOG >%LOG%
MAP 0xE0001000, 0xE0001FFF READ WRITE

FUNC void on_set (void) { printf("SET states=%u FIO1PIN=%08X PORT2=%08X\n", states, _RDWORD(0x2009C034), PORT2); }
FUNC void on_clr (void) { printf("CLR states=%u FIO1PIN=%08X PORT2=%08X\n", states, _RDWORD(0x2009C034), PORT2); }
SIGNAL void press_int0 (void) {
  swatch (0.2);
  PORT2 &= ~(1 << 10);                       // press: pin low
  printf("PRESS states=%u PORT2=%08X\n", states, PORT2);
  swatch (0.1);
  PORT2 |= (1 << 10);                        // release
  printf("RELEASE states=%u PORT2=%08X\n", states, PORT2);
}
SIGNAL void stop_at (float secs) {
  swatch (secs);
  _break_ = 1;
}

BA WRITE (unsigned long *)0x2009C038, 4, 1, "on_set()"   // FIO1SET
BA WRITE (unsigned long *)0x2009C03C, 4, 1, "on_clr()"   // FIO1CLR
press_int0 ()
stop_at (1.25)
G
printf("AFTER states=%u FIO1PIN=%08X LED0=%u\n", states, _RDWORD(0x2009C034), (_RDWORD(0x2009C034) >> 28) & 1)
LOG OFF
EXIT
