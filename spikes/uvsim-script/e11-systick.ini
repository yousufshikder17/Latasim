// E11: SysTick in the LPC1768 simulator, with real firmware.
// Keil's MCB1700 Blinky_ULp example (LPC1700_DFP 2.6.0), built unmodified from a copy of
// the pack folder whose first target ("SWO Trace") is switched to the simulator
// (uSim=1, uTrg=0, sIfile=.\sim.ini; the project already selects DARMP1.DLL -pLPC1768).
// Runs from reset; the firmware calls SysTick_Config(SystemCoreClock/100) and steps an
// LED chase in SysTick_Handler.
//
// Outcome (e11-run1.out, e11-run2.out identical):
//   RESET: STCTRL=00000000 STCALIB=00000000 (UM10360 Table 438 says 0x4 and 0x000F423F;
//          CALIB is set by the boot ROM, which the simulator does not run).
//   The watch on 0xE000E010 also fires on the counter's own updates. SysTick_Config's
//   STCTRL write at state 11379 already shows STCURR=000F423F: RELOAD is loaded when
//   ENABLE is set. The counter reaches 0 (COUNTFLAG set) at 1011378, 2011378, ...:
//   first after RELOAD = 999,999 clocks, then every 1,000,000.
//   The BS on SysTick_Handler never fired (unexplained); e11-leds.ini watches the LED
//   stores instead. AD_last reads 0 at the end: the chase steps on every tick.
LOG >%LOG%
MAP 0xE0001000, 0xE0001FFF READ WRITE

FUNC void on_config (void) {
  printf("STCTRL-WRITE states=%u STCTRL=%08X STRELOAD=%08X STCURR=%08X\n", states, _RDWORD(0xE000E010), _RDWORD(0xE000E014), _RDWORD(0xE000E018));
}
FUNC void on_tick (void) {
  printf("TICK states=%u FIO1PIN=%08X FIO2PIN=%08X\n", states, _RDWORD(0x2009C034), _RDWORD(0x2009C054));
}
SIGNAL void stop_at (float secs) {
  swatch (secs);
  _break_ = 1;
}

printf("RESET states=%u STCTRL=%08X STRELOAD=%08X STCURR=%08X STCALIB=%08X\n", states, _RDWORD(0xE000E010), _RDWORD(0xE000E014), _RDWORD(0xE000E018), _RDWORD(0xE000E01C))
BA WRITE (unsigned long *)0xE000E010, 4, 1, "on_config()"
BS SysTick_Handler, 1, "on_tick()"
stop_at (0.105)
G
printf("END states=%u FIO1PIN=%08X FIO2PIN=%08X\n", states, _RDWORD(0x2009C034), _RDWORD(0x2009C054))
printf("AD_last=%u\n", AD_last)
LOG OFF
EXIT
