// INI for the UVSC spike on the bit-band test snapshot (installed as sim.ini, run at DBG_ENTER).
// No G / EXIT: execution is driven over UVSC. Pins are logged at every delay() entry
// (= after each LED operation); the LOG is closed at BarrelShift (the spike's final stop).
LOG >%LOG%
FUNC void snap (void) {
  printf("SNAP states=%u P1.28=%u P1.27=%u P2.2=%u\n", states,
         (_RDWORD(0x2009C034) >> 28) & 1, (_RDWORD(0x2009C034) >> 27) & 1, (_RDWORD(0x2009C054) >> 2) & 1);
}
FUNC void fin (void) {
  snap();
  exec("LOG OFF");   // flush; the post-reset SNAP is checked in the UVSC wire log instead
}
BS delay, 1, "snap()"
BS BarrelShift, 1, "fin()"
