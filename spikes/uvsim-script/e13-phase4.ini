LOG >%LOG%
MAP 0xE0001000, 0xE0001FFF READ WRITE
AIN2 = 1.65
PORT2 = PORT2 | (1 << 10)
G, wait_pin
printf("pin before press: %08X\n", PORT2)
PORT2 = PORT2 & ~(1 << 10)
G, wait_pin
PORT2 = PORT2 | (1 << 10)
G, wait_pin
PORT2 = PORT2 & ~(1 << 10)
G, finished
printf("A r0 TC after IR (no reset)   = %u\n", r[0])
printf("A r1 TC after IR (reset)      = %u\n", r[1])
