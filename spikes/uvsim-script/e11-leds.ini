// E11 (LEDs): the LED stores of the same Blinky_ULp run.
// Keil's MCB1700 Blinky_ULp example (LPC1700_DFP 2.6.0), built unmodified from a copy of
// the pack folder whose first target ("SWO Trace") is switched to the simulator
// (uSim=1, uTrg=0, sIfile=.\sim.ini; the project already selects DARMP1.DLL -pLPC1768).
// Runs from reset; the firmware calls SysTick_Config(SystemCoreClock/100) and steps an
// LED chase in SysTick_Handler.
//
// Outcome (e11-leds-run1.out, e11-leds-run2.out identical; each store is reported
// 2-3 times by the 8-byte watch): LED_Initialize at ~5.4k-6.4k states, then each
// tick's LED_SetOut about 114-491 states after the count to 0 (handler execution):
// tick 1 lights LED1 (FIO1PIN 6FFFC713), tick 2 clears LED1 then sets LED2
// (CFFFC713), tick 3 clears LED2 then sets LED3 (FIO2PIN 3F87).
LOG >%LOG%
MAP 0xE0001000, 0xE0001FFF READ WRITE

FUNC void on_led (void) {
  printf("W states=%u FIO1PIN=%08X FIO2PIN=%08X STCURR=%08X\n", states, _RDWORD(0x2009C034), _RDWORD(0x2009C054), _RDWORD(0xE000E018));
}
SIGNAL void stop_at (float secs) {
  swatch (secs);
  _break_ = 1;
}

BA WRITE (unsigned long *)0x2009C038, 8, 1, "on_led()"
BA WRITE (unsigned long *)0x2009C058, 8, 1, "on_led()"
stop_at (0.035)
G
printf("END states=%u FIO1PIN=%08X FIO2PIN=%08X\n", states, _RDWORD(0x2009C034), _RDWORD(0x2009C054))
LOG OFF
EXIT
