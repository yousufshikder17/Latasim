// E10: the Phase 2 `latasim firmware-demo` scenario as real firmware in the LPC1768
// simulator (B3 reference). e10-firmware-demo-firmware.c is built by ARMCC 5.06 in a
// copy of the bit-band test firmware project with its main source replaced and the
// pack's Boards/Keil/MCB1700/Common and MDK-Middleware Board directories added to the
// C include path. At each checkpoint() this INI prints the GPIO state and injects
// inputs through the PORT1/PORT2 pin VTREGs, as E4 did.
//
// Outcome (e10-run1.out, e10-run2.out identical), matching Latasim at every point:
//   CP1 after LED/Joystick/Buttons_Initialize: FIO1DIR=B0000000 FIO2DIR=0000007C
//       FIO1PIN=4FFFC713 FIO2PIN=00003F83 PCONP=042887DE
//   CP2 after LED_On(0): FIO1PIN=5FFFC713
//   Joystick_GetState() with UP pressed = 08 (JOYSTICK_UP), FIO1PIN=5F7FC713
//   Buttons_GetState() with INT0 pressed = 01, FIO2PIN=00003B83
//   CP5 after LED_SetOut(0x09): FIO1PIN=5F7FC713 FIO2PIN=00003B87 FIO1SET=10000000
//       FIO2SET=00000004; after release FIO1PIN=5FFFC713 FIO2PIN=00003F87
LOG >%LOG%
MAP 0xE0001000, 0xE0001FFF READ WRITE

FUNC void snap (void) {
  printf("CP%u FIO1DIR=%08X FIO2DIR=%08X FIO1PIN=%08X FIO2PIN=%08X FIO1SET=%08X FIO2SET=%08X PCONP=%08X joystick=%02X buttons=%02X\n", R0, _RDWORD(0x2009C020), _RDWORD(0x2009C040), _RDWORD(0x2009C034), _RDWORD(0x2009C054), _RDWORD(0x2009C038), _RDWORD(0x2009C058), _RDWORD(0x400FC0C4), g_joystick, g_buttons);
  if (R0 == 2) {
    PORT1 &= ~(1 << 23);
    printf("PRESS joystick UP: PORT1=%08X FIO1PIN=%08X\n", PORT1, _RDWORD(0x2009C034));
  }
  if (R0 == 3) {
    PORT2 &= ~(1 << 10);
    printf("PRESS INT0: PORT2=%08X FIO2PIN=%08X\n", PORT2, _RDWORD(0x2009C054));
  }
  if (R0 == 5) {
    PORT1 |= (1 << 23);
    PORT2 |= (1 << 10);
    printf("RELEASE both: FIO1PIN=%08X FIO2PIN=%08X\n", _RDWORD(0x2009C034), _RDWORD(0x2009C054));
  }
}

BS checkpoint, 1, "snap()"
G, finished
printf("DONE g_id=%X FIO1PIN=%08X FIO2PIN=%08X\n", g_id, _RDWORD(0x2009C034), _RDWORD(0x2009C054))
LOG OFF
EXIT
