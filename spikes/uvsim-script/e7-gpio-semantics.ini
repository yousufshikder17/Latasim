// E7: LPC17xx GPIO register semantics, probed in the LPC1768 simulator (Phase 1 reference check).
// Debugger accesses only (_RDWORD/_WDWORD); the CPU never runs. Port 1 (FIO1 = 0x2009C020).
// DIR +0x00, MASK +0x10, PIN +0x14, SET +0x18, CLR +0x1C.
LOG >%LOG%
printf("R0 reset: DIR=%08X MASK=%08X PIN=%08X SET=%08X CLR=%08X\n", _RDWORD(0x2009C020), _RDWORD(0x2009C030), _RDWORD(0x2009C034), _RDWORD(0x2009C038), _RDWORD(0x2009C03C))
_WDWORD(0x2009C038, 0x10000000)
printf("R1 SET bit28 while input: PIN=%08X SET=%08X\n", _RDWORD(0x2009C034), _RDWORD(0x2009C038))
_WDWORD(0x2009C020, 0x10000000)
printf("R2 DIR bit28=1: PIN=%08X SET=%08X\n", _RDWORD(0x2009C034), _RDWORD(0x2009C038))
_WDWORD(0x2009C03C, 0x10000000)
printf("R3 CLR bit28: PIN=%08X SET=%08X CLR=%08X\n", _RDWORD(0x2009C034), _RDWORD(0x2009C038), _RDWORD(0x2009C03C))
_WDWORD(0x2009C030, 0x10000000)
printf("R4 MASK bit28: MASK=%08X PIN=%08X SET=%08X\n", _RDWORD(0x2009C030), _RDWORD(0x2009C034), _RDWORD(0x2009C038))
_WDWORD(0x2009C038, 0x10000000)
printf("R5 SET bit28 while masked: PIN=%08X SET=%08X\n", _RDWORD(0x2009C034), _RDWORD(0x2009C038))
_WDWORD(0x2009C034, 0xFFFFFFFF)
printf("R6 PIN=all-ones while bit28 masked: PIN=%08X SET=%08X\n", _RDWORD(0x2009C034), _RDWORD(0x2009C038))
_WDWORD(0x2009C030, 0x00000000)
printf("R7 unmask: PIN=%08X SET=%08X\n", _RDWORD(0x2009C034), _RDWORD(0x2009C038))
_WDWORD(0x2009C034, 0x00000000)
printf("R8 PIN=0: PIN=%08X SET=%08X DIR=%08X\n", _RDWORD(0x2009C034), _RDWORD(0x2009C038), _RDWORD(0x2009C020))
_WDWORD(0x2009C020, 0x00000000)
printf("R9 DIR=0 (all input): PIN=%08X SET=%08X\n", _RDWORD(0x2009C034), _RDWORD(0x2009C038))
PORT1 = PORT1 & ~0x00100000
printf("R10 external P1.20 low (input): PIN=%08X PORT1=%08X\n", _RDWORD(0x2009C034), PORT1)
_WDWORD(0x2009C020, 0xFFFFFFFF)
printf("R11 DIR=all-ones: DIR=%08X PIN=%08X\n", _RDWORD(0x2009C020), _RDWORD(0x2009C034))
_WDWORD(0x2009C020, 0x10000000)
_WDWORD(0x2009C038, 0x10000000)
printf("R12 bit28 output high: PIN=%08X SET=%08X\n", _RDWORD(0x2009C034), _RDWORD(0x2009C038))
_WDWORD(0x2009C030, 0x10000000)
printf("R13 MASK bit28 (pin high): PIN=%08X SET=%08X\n", _RDWORD(0x2009C034), _RDWORD(0x2009C038))
_WDWORD(0x2009C030, 0x00000001)
printf("R14 MASK bit0 (input pin high): PIN=%08X\n", _RDWORD(0x2009C034))
_WDWORD(0x2009C030, 0x00000000)
_WDWORD(0x2009C020, 0xFFFFFFFF)
_WDWORD(0x2009C038, 0xFFFFFFFF)
printf("R15 all output, SET all-ones: PIN=%08X SET=%08X\n", _RDWORD(0x2009C034), _RDWORD(0x2009C038))
LOG OFF
EXIT
