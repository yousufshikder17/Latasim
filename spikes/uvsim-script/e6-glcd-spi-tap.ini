// E6: can B3 see GLCD traffic? joystick/LED demo firmware (legacy Keil GLCD_SPI_LPC1700.c: SSP1, CS = P0.6 GPIO).
// A signal function blocks on writes to the SSP1_OUT VTREG and counts/dumps bytes.
LOG >%LOG%
DEFINE unsigned long nbytes
DEFINE unsigned long ndump
DEFINE unsigned long dumping

SIGNAL void ssp1_tap (void) {
  while (1) {
    wwatch (SSP1_OUT);
    nbytes++;
    if (dumping && ndump < 48) {
      printf("B%02u %02X cs=%u\n", ndump, SSP1_OUT & 0xFF, (_RDWORD(0x2009C014) >> 6) & 1);
      ndump++;
    }
  }
}
FUNC void mark (unsigned long id) {
  printf("MARK %u states=%u ssp1_bytes=%u\n", id, states, nbytes);
}

nbytes = 0
ndump = 0
dumping = 0
ssp1_tap ()
BS GLCD_Clear, 1, "mark(1)"
BS GLCD_DisplayString, 1, "mark(2)"
G, GLCD_DisplayString
dumping = 1
G, GLCD_SetTextColor
mark (3)
LOG OFF
EXIT
